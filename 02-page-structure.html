<!DOCTYPE html>
<!--
  LESSON 02: THE SKELETON OF EVERY PAGE
  =====================================
  You will learn:
    * the parts that every HTML page must have
    * what belongs in the head and what belongs in the body
    * three small lines that make a page work well everywhere
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lesson 02: The skeleton of every page</title>
</head>
<body>

  This page costs ₦0 to make. Ẹ ṣé! (That means "thank you" in Yoruba.)

  <!--
    THE SKELETON, LINE BY LINE
    ==========================
    Scroll up and look at the first lines of this file.

    <!DOCTYPE html>
        Says "this is a modern HTML page". It is always line 1.

    <html lang="en"> ... </html>
        The whole page. lang="en" says that the page is in English.
        Screen readers (programs that read a page aloud for blind
        people) use it to pronounce the words correctly.

    <head> ... </head>
        Information ABOUT the page.
        Nothing in the head appears on the page itself.

    <meta charset="UTF-8">
        Lets the page show every letter and symbol in the world:
        the naira sign, Yoruba, Igbo and Hausa letters, even emoji.
        Without it, some symbols can turn into strange characters.

    <meta name="viewport" content="width=device-width, initial-scale=1">
        Makes the page fit the screen of a phone. Without it, a phone
        shows the page very small, as if it were a wide desktop screen.

    <title> ... </title>
        The words on the browser tab. Search engines such as Google
        also show the title in their results, so choose it well.

    <body> ... </body>
        Everything that you SEE on the page.

    GOOD HABIT
        Start every new page by typing this skeleton first.
        From now on, every lesson uses it.
  -->

  <!--
    TRY IT YOURSELF
    ===============
    1. Change the title. Save, refresh, and look at the browser tab.
    2. Add your own sentence in the body. Use the naira sign in it.
       (To type the naira sign, copy it from the sentence above.)
    3. Open a new empty file in your editor. Type the whole skeleton
       from memory, save it as  my-page.html  and open it.
       Tip: file names should be lowercase, with no spaces.
  -->

</body>
</html>
