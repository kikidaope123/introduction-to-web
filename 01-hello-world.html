<!DOCTYPE html>
<!--
  LESSON 01: HELLO, WORLD!
  ========================
  Welcome! This is your very first web page.

  WHAT IS THIS TEXT?
    You are reading a COMMENT. A comment is a note for people.
    The browser does not show comments on the page.
    We use comments in every lesson to explain the code to you.

  HOW TO SEE THE PAGE
    Double-click this file. It opens in your web browser
    (Chrome, Edge or Firefox).

  HOW TO SEE THE CODE
    Right-click this file, choose "Open with", then choose Notepad.
    If you have VS Code, use it instead. It is free, and it shows
    the code in colour.

  THE THREE STEPS YOU WILL REPEAT ALL SEMESTER
    1. CHANGE something in the code.
    2. SAVE the file.           Press Ctrl + S
    3. REFRESH the browser.     Press F5
-->

<!-- The first line of this file, DOCTYPE, tells the browser:
     "This is a modern HTML page." Every page starts with it. -->

<!-- Everything in a web page sits between <html> and </html>. -->
<html>

<!-- The HEAD holds information ABOUT the page.
     It does not appear on the page itself. -->
<head>
  <!-- The TITLE appears on the browser tab, at the top of the window. -->
  <title>My First Web Page</title>
</head>

<!-- The BODY holds everything that you SEE on the page. -->
<body>

  Hello, World!

  <!--
    TRY IT YOURSELF
    ===============
    1. Change "Hello, World!" to "Hello, Nigeria!".
       Save the file, then refresh the browser.
    2. Change the title to your own name. Look at the browser tab.
    3. Add a second sentence after the first one, for example:
       My name is Ada and I am learning HTML.
  -->

</body>

</html>
