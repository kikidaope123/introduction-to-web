<!DOCTYPE html>
<!--
  LESSON 06: WRITING NEAT CODE
  ============================
  You will learn:
    * that the browser does not care how your code is laid out
    * that PEOPLE care a lot, so we keep our code neat
    * six simple rules for tidy HTML
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lesson 06: Writing neat code</title>
</head>
<body>

  <h1>Writing neat code</h1>

  <!--
    MESSY CODE
    The next four lines work, but they are hard to read.
    Tags are in CAPITALS, two elements share one line,
    and the text is broken in strange places.
  -->
<H2>My week (messy)</H2><P>On Monday I have
a lecture.</P>
        <p>On Tuesday      I am
free.</p>

  <!--
    NEAT CODE
    These three lines make exactly the same thing on the page.
    Which version would you prefer to fix at midnight before a deadline?
  -->
  <h2>My week (neat)</h2>
  <p>On Monday I have a lecture.</p>
  <p>On Tuesday I am free.</p>

  <!--
    SIX RULES FOR NEAT HTML
      1. Write tags and attributes in lowercase.
      2. Put each element on its own line.
      3. INDENT: when an element is inside another one, move it
         two spaces to the right. Look at this file: everything
         inside <body> starts two spaces in.
      4. Leave an empty line between the different parts of a page.
      5. Always write the closing tag.
      6. Always put "double quotes" around attribute values.

    WHY BOTHER?
      The browser ignores extra spaces, empty lines and capital
      letters in tags. But you will read your code many more times
      than you write it. Neat code is easier to read, easier to
      fix, and easier to share with your classmates.

    TIP FOR VS CODE
      Press  Shift + Alt + F  and VS Code tidies the whole file for you.
  -->

  <!--
    TRY IT YOURSELF
    ===============
    1. Rewrite the four messy lines so that they are neat.
       Save and refresh. The page should look the same as before.
    2. Add a neat paragraph for Wednesday.
    3. Look back at lessons 01 to 05. Can you see the six rules in them?
  -->

</body>
</html>
