<!DOCTYPE html>
<!--
  LESSON 05: COMMENTS
  ===================
  You will learn:
    * how to write a comment on one line or on many lines
    * how to "switch off" some code without deleting it
    * what you must never write in a comment
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lesson 05: Comments</title>
</head>
<body>

  <h1>Comments</h1>

  <!-- This is a comment on one line. The browser does not show it. -->
  <p>You can see this paragraph. The comment above it is invisible.</p>

  <!--
    This comment is spread over several lines.
    Look at how a comment starts and ends:
      * it STARTS with the first four characters of this note
      * it ENDS with the last three characters of this note
    Everything in between is ignored by the browser.
  -->
  <p>You can see this paragraph too.</p>

  <!--
    SWITCHING OFF CODE
    Put comment marks around some code and the browser ignores it.
    This is useful when you want to test the page without that code.
    The paragraph on the next line is switched off:
  -->
  <!-- <p>This paragraph is switched off. Nobody can see it.</p> -->

  <p>This is the last paragraph on the page.</p>

  <!--
    WHY DO WE WRITE COMMENTS?
      1. To explain the code to other people.
      2. To explain the code to yourself. In six months you will forget!
      3. To mark the parts of a long page, for example  START OF MENU.
      4. To switch off some code for a short time.

    WARNING
      Comments are hidden on the page, but they are NOT secret.
      Anybody can read them: in the browser, press Ctrl + U
      ("View page source"). Never write a password in a comment.

    TIP FOR VS CODE
      Select some lines and press Ctrl + /  to turn them into a
      comment. Press Ctrl + /  again to turn them back into code.
  -->

  <!--
    TRY IT YOURSELF
    ===============
    1. In the browser, press Ctrl + U. Can you find the comments?
    2. Switch the hidden paragraph back ON: remove the comment
       marks around it. Save and refresh.
    3. Switch OFF the last paragraph by putting comment marks around it.
    4. Add your own one-line comment with your name and today's date.
  -->

</body>
</html>
