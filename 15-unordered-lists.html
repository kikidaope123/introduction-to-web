<!DOCTYPE html>
<!--
  LESSON 15: BULLET LISTS
  =======================
  You will learn:
    * how to make a bullet list with <ul> and <li>
    * what you may put inside a list item
    * when a list is the right choice
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lesson 15: Bullet lists</title>
</head>
<body>

  <h1>Bullet lists</h1>

  <!--
    <ul> means UNORDERED LIST: a list where the order does not matter.
    <li> means LIST ITEM. Every item goes in its own <li> element.
    The browser puts a bullet (a black dot) in front of each item.

    Notice the indentation: each <li> is INSIDE the <ul>,
    so it is moved two spaces to the right.
  -->
  <h2>What to buy at the market</h2>
  <ul>
    <li>Rice</li>
    <li>Beans</li>
    <li>Garri</li>
    <li>Palm oil</li>
    <li>Fresh tomatoes</li>
  </ul>

  <!--
    A list item can contain other elements,
    for example <strong>, <em> or <b>.
  -->
  <h2>What I need for this course</h2>
  <ul>
    <li>A <strong>laptop</strong> or a desktop computer</li>
    <li>A web browser, for example <b>Chrome</b> or <b>Firefox</b></li>
    <li>A code editor (<em>VS Code is free</em>)</li>
    <li>The wish to learn!</li>
  </ul>

  <!--
    RULES
      * Only <li> elements may sit directly inside <ul>.
        Do not put text or a <p> straight into the <ul>.
      * Every <li> needs its closing tag </li>.

    GOOD HABIT
      When you have several similar things, use a real list.
      Do not fake a list with dashes and <br> tags. A real list
      is easier to read, and a screen reader tells a blind user
      "list with five items".
  -->

  <!--
    TRY IT YOURSELF
    ===============
    1. Add two more things to the market list.
    2. Make a new list of your five favourite Nigerian musicians.
    3. Put a level 2 heading above your new list.
  -->

</body>
</html>
